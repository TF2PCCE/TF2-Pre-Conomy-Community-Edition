# They're OLD!
name: Build

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2025
    env:
        build_script: createtf2pcceprojects.bat
        build_cmd: msbuild tf2pcce.sln /p:Configuration=Release /p:Platform=win64 /m
        artifact_name: tf2pcce-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Restore Windows build cache
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\Microsoft\MSBuild
            C:\Users\runneradmin\AppData\Local\Temp
          key: ${{ runner.os }}-msvc-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-msvc-
      #-- end caching

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: ${{ env.build_script }}
        shell: cmd
        working-directory: src

      - name: Build
        working-directory: src
        run: ${{ env.build_cmd }}

      - name: Save Windows build cache
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\Microsoft\MSBuild
            C:\Users\runneradmin\AppData\Local\Temp
          key: ${{ runner.os }}-msvc-${{ github.sha }}

      - name: Clean up Windows build
        run: |
            for /r "game" %%f in (*.pdb) do del /q "%%f"
        shell: cmd

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}-binaries
          path: game/tf2pc/bin

      - name: Upload Game Folder
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}-game
          path: game/
          
      - name: Upload TF2PCCE Folder
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}-tf2pcce_folder
          path: game/tf2pc/
          
  build-linux:
    runs-on: ubuntu-latest
    env:
        build_script: ./buildtf2pcceprojects
        build_cmd: ""
        artifact_name: tf2pcce-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          
      - name: Install Python
        run: sudo apt-get install -y python3

      #-- caching
      - name: Setup ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          echo 'export PATH="/usr/lib/ccache:$PATH"' >> $GITHUB_ENV

      - name: ~/.ccache stuff
        run: |
          if [ ! -d ~/.ccache ]; then
            mkdir ~/.ccache
          fi

      - name: Restore ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      
      - name: Make build script executable
        run: chmod +x ./buildtf2pcceprojects
        working-directory: src

      - name: Install Linux build dependencies
        run: |
          sudo apt-get install -y g++-multilib ninja-build lib32z1-dev podman file

      # Set 64-bit compilation environment
      - name: Set 64-bit build environment
        run: |
          echo "CFLAGS=-m64" >> $GITHUB_ENV
          echo "CXXFLAGS=-m64" >> $GITHUB_ENV
          echo "LDFLAGS=-m64" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        shell: bash

      - name: Clean previous builds
        run: |
          cd src
          rm -rf _vpc_/
        shell: bash

      - name: Build
        run: ${{ env.build_script }}
        working-directory: src
        shell: bash

      - name: Clean and strip
        run: |
          find game/tf2pc/bin/linux64 -type f -executable -exec strip --strip-all {} +
          if [ -f game/tf2pc_linux64 ]; then
            strip --strip-all game/tf2pc_linux64
          fi
        shell: bash

      - name: Save ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}-binaries
          path: game/tf2pc/bin

      - name: Upload Game Folder
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}-game
          path: game/
          
      - name: Upload TF2PCCE Folder
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}-tf2pcce_folder
          path: game/tf2pc/